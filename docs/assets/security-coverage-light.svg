<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" role="img" aria-label="StremioGuard security coverage map (v0.4.2): measured Python unit line+branch coverage alongside estimated audit depth and real-container test markers across 8 domains">
  <title>StremioGuard Security Coverage (v0.4.2)</title>
  <desc>Horizontal bar chart comparing measured Python unit-test line+branch coverage (84.9% whole package) with estimated audit depth and real-container test markers across 8 domains.</desc>
  <defs>
    <clipPath id="bar-1"><rect x="266" y="87" width="320" height="10" rx="5" /></clipPath>
    <clipPath id="bar-2"><rect x="266" y="117" width="320" height="10" rx="5" /></clipPath>
    <clipPath id="bar-3"><rect x="266" y="147" width="320" height="10" rx="5" /></clipPath>
    <clipPath id="bar-4"><rect x="266" y="177" width="320" height="10" rx="5" /></clipPath>
    <clipPath id="bar-5"><rect x="266" y="207" width="320" height="10" rx="5" /></clipPath>
    <clipPath id="bar-6"><rect x="266" y="237" width="320" height="10" rx="5" /></clipPath>
    <clipPath id="bar-7"><rect x="266" y="267" width="320" height="10" rx="5" /></clipPath>
  </defs>

  <!-- Card shell -->
  <rect x="0.5" y="0.5" width="879" height="397" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />

  <!-- Header & Legend -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="24" y="32" font-size="11.5" fill="#656d76">Package Unit</text>
    <text x="115" y="33" font-size="14" font-weight="700" fill="#1f2328">84.9%</text>
    <rect x="169" y="18" width="56" height="20" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <text x="197" y="32" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">v0.4.2</text>

    <rect x="428" y="23" width="10" height="10" rx="2.5" fill="#2563eb" />
    <text x="444" y="32" font-size="11" fill="#656d76">Measured unit</text>

    <rect x="548" y="23" width="10" height="10" rx="2.5" fill="#059669" />
    <text x="564" y="32" font-size="11" fill="#656d76">Audit depth (est.)</text>

    <circle cx="705" cy="28" r="4" fill="#0969da" />
    <text x="716" y="32" font-size="11" fill="#656d76">real-container tests</text>
  </g>

  <line x1="24" y1="50" x2="856" y2="50" stroke="#d8dee4" stroke-width="1" />

  <!-- Column headers -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#656d76">
    <text x="24" y="70">DOMAIN</text>
    <text x="266" y="70">COVERAGE (0-100%)</text>
    <text x="654" y="70" text-anchor="end">UNIT</text>
    <text x="746" y="70" text-anchor="end">AUDIT</text>
    <text x="812" y="70" text-anchor="middle">CONTAINERS</text>
  </g>

  <!-- Domain rows -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1f2328">
    <!-- 1. Gateway & public HTTP (91.7% unit, 98% est., real-container tests) -->
    <text x="24" y="96">Gateway &amp; public HTTP</text>
    <g clip-path="url(#bar-1)">
      <rect x="266" y="87" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="87" width="293.4" height="10" fill="#2563eb" />
      <rect x="559.4" y="87" width="20.2" height="10" fill="#059669" />
    </g>
    <text x="654" y="96" text-anchor="end" fill="#1f2328">91.7%</text>
    <text x="746" y="96" text-anchor="end" fill="#047857">98% est.</text>
    <rect x="768" y="83" width="88" height="18" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1" />
    <circle cx="782" cy="92" r="3" fill="#0969da" />
    <text x="791" y="95.5" font-size="10" fill="#0969da">container</text>

    <!-- 2. Secret hygiene & log scrubbing (90.2% unit, 97% est., real-container tests) -->
    <text x="24" y="126">Secret hygiene &amp; log scrubbing</text>
    <g clip-path="url(#bar-2)">
      <rect x="266" y="117" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="117" width="288.6" height="10" fill="#2563eb" />
      <rect x="554.6" y="117" width="21.8" height="10" fill="#059669" />
    </g>
    <text x="654" y="126" text-anchor="end" fill="#1f2328">90.2%</text>
    <text x="746" y="126" text-anchor="end" fill="#047857">97% est.</text>
    <rect x="768" y="113" width="88" height="18" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1" />
    <circle cx="782" cy="122" r="3" fill="#0969da" />
    <text x="791" y="125.5" font-size="10" fill="#0969da">container</text>

    <!-- 3. VPN egress & watchdog (87.8% unit, 96% est.) -->
    <text x="24" y="156">VPN egress &amp; watchdog</text>
    <g clip-path="url(#bar-3)">
      <rect x="266" y="147" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="147" width="281.0" height="10" fill="#2563eb" />
      <rect x="547.0" y="147" width="26.2" height="10" fill="#059669" />
    </g>
    <text x="654" y="156" text-anchor="end" fill="#1f2328">87.8%</text>
    <text x="746" y="156" text-anchor="end" fill="#047857">96% est.</text>
    <text x="812" y="156" text-anchor="middle" fill="#656d76">—</text>

    <!-- 4. Comet app & stream proxy* (83.9% unit, 95% est., real-container tests) -->
    <text x="24" y="186">Comet app &amp; stream proxy*</text>
    <g clip-path="url(#bar-4)">
      <rect x="266" y="177" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="177" width="268.5" height="10" fill="#2563eb" />
      <rect x="534.5" y="177" width="35.5" height="10" fill="#059669" />
    </g>
    <text x="654" y="186" text-anchor="end" fill="#1f2328">83.9%</text>
    <text x="746" y="186" text-anchor="end" fill="#047857">95% est.</text>
    <rect x="768" y="173" width="88" height="18" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1" />
    <circle cx="782" cy="182" r="3" fill="#0969da" />
    <text x="791" y="185.5" font-size="10" fill="#0969da">container</text>

    <!-- 5. Containers & supply chain (88.9% unit, 95% est.) -->
    <text x="24" y="216">Containers &amp; supply chain</text>
    <g clip-path="url(#bar-5)">
      <rect x="266" y="207" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="207" width="284.5" height="10" fill="#2563eb" />
      <rect x="550.5" y="207" width="19.5" height="10" fill="#059669" />
    </g>
    <text x="654" y="216" text-anchor="end" fill="#1f2328">88.9%</text>
    <text x="746" y="216" text-anchor="end" fill="#047857">95% est.</text>
    <text x="812" y="216" text-anchor="middle" fill="#656d76">—</text>

    <!-- 6. Host state & systemd (93.2% unit, 94% est.) -->
    <text x="24" y="246">Host state &amp; systemd</text>
    <g clip-path="url(#bar-6)">
      <rect x="266" y="237" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="237" width="298.2" height="10" fill="#2563eb" />
      <rect x="564.2" y="237" width="2.6" height="10" fill="#059669" />
    </g>
    <text x="654" y="246" text-anchor="end" fill="#1f2328">93.2%</text>
    <text x="746" y="246" text-anchor="end" fill="#047857">94% est.</text>
    <text x="812" y="246" text-anchor="middle" fill="#656d76">—</text>

    <!-- 7. Stremio profile (opt-in) (n/a unit, 84% est., real-container tests) -->
    <text x="24" y="276">Stremio profile (opt-in)</text>
    <g clip-path="url(#bar-7)">
      <rect x="266" y="267" width="320" height="10" fill="#e2e8f0" />
      <rect x="266" y="267" width="268.8" height="10" fill="#059669" />
    </g>
    <text x="654" y="276" text-anchor="end" fill="#656d76">n/a</text>
    <text x="746" y="276" text-anchor="end" fill="#047857">84% est.</text>
    <rect x="768" y="263" width="88" height="18" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="1" />
    <circle cx="782" cy="272" r="3" fill="#0969da" />
    <text x="791" y="275.5" font-size="10" fill="#0969da">container</text>

    <!-- 8. Sidecars (StremThru & Postgres) (n/a unit, isolated, not source-audited) -->
    <text x="24" y="306">Sidecars (StremThru &amp; Postgres)</text>
    <rect x="266" y="293" width="320" height="18" rx="4" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3" />
    <text x="426" y="305.5" text-anchor="middle" font-size="10.5" fill="#656d76">isolated, not source-audited</text>
    <text x="654" y="306" text-anchor="end" fill="#656d76">n/a</text>
    <text x="746" y="306" text-anchor="end" fill="#656d76">—</text>
    <text x="812" y="306" text-anchor="middle" fill="#656d76">—</text>
  </g>

  <!-- Footer -->
  <line x1="24" y1="334" x2="856" y2="334" stroke="#d8dee4" stroke-width="1" />
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#656d76">
    <text x="24" y="356">* overrides/stream_guard.py reads 0% in unit tests (tested inside real Comet image via STREMIOGUARD_DOCKER_TESTS=1).</text>
    <text x="24" y="376">Unit: scripts/coverage_by_domain.py (line+branch) · Audit (est.): engineering judgement · Host perimeter: user-managed.</text>
  </g>
</svg>
