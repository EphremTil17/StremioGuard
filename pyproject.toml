[project]
name = "stremio-vpn-guard"
version = "0.4.2"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "typer>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stremioguard"]

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
# stream_guard.py is source for Comet; it imports Comet-only packages.
exclude = ["vendor/comet", "src/stremioguard/overrides/stream_guard.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mutmut]
# Mutation testing; scripts/mutation_report.py summarises a run.
# Mutate one security domain at a time by editing only_mutate.
source_paths = ["src/stremioguard/"]
only_mutate = ["src/stremioguard/guard.py", "src/stremioguard/comet_gateway.py"]
also_copy = ["docker-compose.yml", "docker/", "docs/", "scripts/", "stremio", ".env.example", "assets/", "vendor/", "AGENTS.md", "README.md"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = ["tests/"]
