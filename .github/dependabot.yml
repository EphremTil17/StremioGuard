version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker/stremio"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # Digest-pinned compose images. gluetun follows its v3 release channel on
  # purpose, and Comet's digest is promoted by `./stremio comet update`.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "build"
    allow:
      - dependency-name: "muniftanjim/stremthru"
      - dependency-name: "nginx"
      - dependency-name: "postgres"
      - dependency-name: "busybox"
    ignore:
      # A Postgres major needs pg_upgrade on the data directory, not a new image.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # uv, not pip: the pip ecosystem bumps pyproject.toml but leaves uv.lock
  # stale, so every merged update needed a manual relock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      python-dependencies:
        patterns:
          - "*"
