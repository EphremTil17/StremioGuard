name: Comet Canary

# Daily upstream-drift canary (plan Phase 7.2): resolve the remote digest of
# <image>:latest, validate it against the patch generator when it differs
# from the lock's tested_digest, then either bump, test and merge it, or file
# a drift issue. Scheduled runs fire on the repository's DEFAULT branch only.
#
# A passing bump merges on its own: the patches validated against the new
# image, and the full test suite passed with the bumped lock. Merging deploys
# nothing; `./stremio comet update` promotes a digest on the host, and uses
# tested_digest as its fallback when a newer candidate fails validation.
#
# Two trust levels, two kinds of job. `validate` pulls and runs the upstream
# image and the test suite with a read-only token that is not kept in the
# checkout. Only the small jobs after it can write, and they run no upstream
# code: `publish` re-creates the one-line lock change from the validated
# digest and opens and merges the PR; `drift-issue` files the report. Every
# action is pinned to a full commit SHA (the comment names the release), so a
# moved tag cannot change what runs with write access.
#
# PRs created with the built-in GITHUB_TOKEN do not trigger other workflows
# (including ci.yml), which is why `validate` tests the bump itself. If `main`
# ever requires status checks, the merge below will be refused; then use a
# PAT or GitHub App token for `token`, so ci.yml runs on the PR.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Upstream Comet Latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.digests.outputs.image }}
      remote_digest: ${{ steps.digests.outputs.remote_digest }}
      drifted: ${{ steps.digests.outputs.drifted }}
      failed: ${{ steps.run_validation.outputs.failed }}
      tested: ${{ steps.test.outcome }}
      report: ${{ steps.report.outputs.report }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Resolve remote and tested digests
        id: digests
        run: |
          IMAGE=$(jq -r '.image' vendor/comet.lock.json)
          TESTED_DIGEST=$(jq -r '.tested_digest' vendor/comet.lock.json)
          REMOTE_DIGEST=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          # Everything after this job treats the digest as data: refuse anything
          # that is not exactly a sha256 digest.
          if ! printf '%s' "$REMOTE_DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "Unexpected remote digest: $REMOTE_DIGEST" >&2
            exit 1
          fi
          DRIFTED=0
          [ "$REMOTE_DIGEST" = "$TESTED_DIGEST" ] || DRIFTED=1
          {
            echo "image=$IMAGE"
            echo "remote_digest=$REMOTE_DIGEST"
            echo "drifted=$DRIFTED"
          } >> "$GITHUB_OUTPUT"
          echo "Remote :latest digest: $REMOTE_DIGEST"
          echo "Lock tested_digest:    $TESTED_DIGEST"

      - name: Report up to date
        if: steps.digests.outputs.drifted == '0'
        run: echo "Upstream :latest matches tested_digest; nothing to do."

      - name: Run patch validation
        id: run_validation
        if: steps.digests.outputs.drifted == '1'
        env:
          CANDIDATE: ${{ steps.digests.outputs.image }}@${{ steps.digests.outputs.remote_digest }}
        run: |
          docker pull "$CANDIDATE"
          if uv run python -m stremioguard.comet.validate --image "$CANDIDATE" --json > "$RUNNER_TEMP/validation_report.json"; then
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/validation_report.json" || true

      - name: Run the test suite against the bumped lock
        id: test
        if: steps.digests.outputs.drifted == '1' && steps.run_validation.outputs.failed == '0'
        env:
          REMOTE_DIGEST: ${{ steps.digests.outputs.remote_digest }}
        run: |
          jq --arg digest "$REMOTE_DIGEST" '.tested_digest = $digest' vendor/comet.lock.json > "$RUNNER_TEMP/comet.lock.json"
          mv "$RUNNER_TEMP/comet.lock.json" vendor/comet.lock.json
          uv run pytest -q

      # Handed to the next job as compact base64 JSON (a job output, so no
      # artifact action is needed).
      - name: Pass the validation report on
        id: report
        if: always() && steps.digests.outputs.drifted == '1'
        run: |
          FILE="$RUNNER_TEMP/validation_report.json"
          if [ -s "$FILE" ] && jq -e . "$FILE" > /dev/null 2>&1 && [ "$(jq -c . "$FILE" | wc -c)" -le 600000 ]; then
            REPORT=$(jq -c . "$FILE" | base64 -w0)
          elif [ -s "$FILE" ]; then
            REPORT=$(printf '{"detail":"The validation report is too large or not JSON; see the validate job log."}' | base64 -w0)
          else
            REPORT=$(printf '{}' | base64 -w0)
          fi
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

  publish:
    name: Open and merge the validated bump
    needs: validate
    if: needs.validate.outputs.drifted == '1' && needs.validate.outputs.failed == '0' && needs.validate.outputs.tested == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Credentials stay in this checkout for create-pull-request's push; this
      # job runs no upstream or project code that could read them.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump tested_digest and write PR body
        id: success
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          REMOTE_DIGEST: ${{ needs.validate.outputs.remote_digest }}
          REPORT: ${{ needs.validate.outputs.report }}
        run: |
          printf '%s' "$REMOTE_DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'
          jq --arg digest "$REMOTE_DIGEST" '.tested_digest = $digest' vendor/comet.lock.json > "$RUNNER_TEMP/comet.lock.json"
          mv "$RUNNER_TEMP/comet.lock.json" vendor/comet.lock.json
          # Exactly the one-line lock change, nothing else.
          [ "$(git diff --name-only)" = "vendor/comet.lock.json" ]
          SHORT_DIGEST=${REMOTE_DIGEST:7:12}
          echo "short_digest=$SHORT_DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s' "$REPORT" | base64 -d > "$RUNNER_TEMP/validation_report.json"

          {
            echo "### Comet patch validation passed"
            echo
            echo "All StremioGuard patches validated (render, compile, and import-smoke, with every optional feature and the gateway enabled) against the new Comet release: \`$IMAGE@$REMOTE_DIGEST\`."
            echo
            echo "#### Applied patches"
            jq -r '.applied[]? | "- \(.)"' "$RUNNER_TEMP/validation_report.json"
            echo
            echo "<details><summary>Full validation report</summary>"
            echo
            echo '```json'
            jq . "$RUNNER_TEMP/validation_report.json"
            echo '```'
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/pr_body.md"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: vendor/comet.lock.json
          commit-message: "build(deps): bump Comet tested_digest to ${{ steps.success.outputs.short_digest }}"
          title: "build(deps): bump Comet tested_digest to ${{ steps.success.outputs.short_digest }}"
          body-path: ${{ runner.temp }}/pr_body.md
          branch: "canary/comet-${{ steps.success.outputs.short_digest }}"
          delete-branch: true

      # Merges exactly the commit this run validated and tested.
      - name: Merge the validated bump
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"

  drift-issue:
    name: File a drift issue
    needs: validate
    # Either the patches fail against the new image, or they pass and the test suite fails with
    # the bumped lock. Both leave the bump unmerged, so both are reported.
    if: >-
      always() && needs.validate.outputs.drifted == '1'
      && (needs.validate.outputs.failed == '1' || needs.validate.outputs.tested == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: File drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.validate.outputs.image }}
          REMOTE_DIGEST: ${{ needs.validate.outputs.remote_digest }}
          REPORT: ${{ needs.validate.outputs.report }}
          PATCHES_FAILED: ${{ needs.validate.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$REMOTE_DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'
          SHORT_DIGEST=${REMOTE_DIGEST:7:12}
          if [ "$PATCHES_FAILED" = "1" ]; then
            ISSUE_TITLE="Comet upstream drift: patches fail against $SHORT_DIGEST"
            SUMMARY="The daily canary failed to validate the StremioGuard patches against the newest Comet release: \`$IMAGE@$REMOTE_DIGEST\`."
            DIAGNOSTIC_DETAIL=$(printf '%s' "$REPORT" | base64 -d | jq -r '.detail // empty' 2>/dev/null || true)
            [ -n "$DIAGNOSTIC_DETAIL" ] || DIAGNOSTIC_DETAIL="The validator crashed before producing a report; see this workflow run's log."
          else
            ISSUE_TITLE="Comet upstream drift: tests fail with $SHORT_DIGEST"
            SUMMARY="The patches validate against the newest Comet release, \`$IMAGE@$REMOTE_DIGEST\`, but the test suite fails with the lock bumped to it, so the bump was not merged."
            DIAGNOSTIC_DETAIL="See the failing tests in the 'Run the test suite against the bumped lock' step: $RUN_URL"
          fi

          {
            echo "### Comet upstream drift"
            echo
            echo "$SUMMARY"
            echo
            echo "#### Diagnostic"
            echo '```'
            echo "$DIAGNOSTIC_DETAIL"
            echo '```'
          } > "$RUNNER_TEMP/issue_body.md"

          # The marker label is the de-duplication key; --force makes this
          # idempotent whether or not the label already exists.
          gh label create comet-canary --description "Automated Comet upstream drift reports" --force || true
          EXISTING_ISSUE=$(gh issue list --label comet-canary --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file "$RUNNER_TEMP/issue_body.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue_body.md" --label comet-canary
          fi

          echo "$ISSUE_TITLE ($IMAGE@$REMOTE_DIGEST)"
          exit 1
