services:
  gluetun:
    # Release channel, not master builds; the guard best-effort pulls this
    # tag on every start/restart so the newest v3 release is always used.
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:18080
    volumes:
      - ./gluetun-data:/gluetun

  stremio:
    build:
      context: .
      dockerfile: docker/stremio/Dockerfile
      args:
        STREMIO_APPLY_PATCHES: ${STREMIO_APPLY_PATCHES:-1}
    image: stremioguard-stremio:local
    restart: "no"
    shm_size: "2gb"
    environment:
      - NO_CORS=1
      - AUTO_SERVER_URL=1
      - CASTING_DISABLED=${CASTING_DISABLED:-}
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
      - STREMIO_SKIP_HW_PROBE=${STREMIO_SKIP_HW_PROBE:-1}
      - EXTERNAL_BASE_URL=${EXTERNAL_BASE_URL:-}
      - INTERNAL_MEDIA_BASE_URL=${INTERNAL_MEDIA_BASE_URL:-http://127.0.0.1:11470}
    volumes:
      - ./stremio-data:/root/.stremio-server
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy

  comet-gateway:
    image: nginx:alpine
    # restart: "no" like stremio: nothing that fronts debrid traffic should be
    # revived by Docker before the watchdog has re-verified the VPN path. The
    # watchdog auto-starts the Comet trio once gluetun is healthy.
    restart: "no"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  comet-postgres:
    image: postgres:18-alpine
    restart: "no"
    # Credentials are supplied through a generated env_file (.stremio/comet/
    # postgres.env) added by the compose override, so the password is not a
    # hardcoded default in this file.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=100"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet"]
      interval: 5s
      timeout: 5s
      retries: 5

  comet:
    image: ${COMET_IMAGE:-g0ldyy/comet}
    restart: "no"
    environment:
      DATABASE_TYPE: postgresql
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      comet-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
