configs:
  # Blocks Docker's embedded DNS (127.0.0.11), which is otherwise reachable over
  # `-o lo` and forwards outside the tunnel (including single-label names
  # forwarded by gluetun's own local DNS server). Gluetun executes every line of
  # `/iptables/post-rules.txt` and refuses to start if any rule fails; a
  # content change requires bumping the `-vN` suffix because Compose does not
  # recreate a container when only a config's content changes.
  gluetun-post-rules-v1:
    content: |
      iptables -I OUTPUT -d 127.0.0.11/32 -j REJECT

  # Enforces SCRAM-SHA-256 on all TCP clients (127.0.0.1 and ::1) inside the
  # shared gluetun namespace, overriding any `trust` rules in the existing
  # data directory's pg_hba.conf. The Unix socket stays `trust` because it
  # exists only inside the comet-postgres container, serves as the operator's
  # recovery path, and is used by the image's init scripts. Bump the `-vN`
  # suffix on any content change because Compose does not recreate a container
  # when only config content changes.
  comet-postgres-hba-v1:
    content: |
      # TYPE  DATABASE  USER  ADDRESS       METHOD
      local   all       all                 trust
      host    all       all   127.0.0.1/32  scram-sha-256
      host    all       all   ::1/128       scram-sha-256

services:
  # A gate, not a service. `docker compose up` on its own produces a stack with
  # no published ports, an unconfigured Comet, no public-IP leak check and no
  # watchdog -- quietly broken rather than dangerous, which is worse to debug.
  # Everything hangs off gluetun, so gating gluetun gates the whole stack.
  #
  # The name carries the instruction on purpose. Compose prints the container's
  # own output only for an attached `up`; for `up -d` the single line the
  # operator sees is `service "..." didn't complete successfully`, so the
  # service name is the only text guaranteed to reach them either way.
  #
  # Nothing here is interpolated with `${VAR:?}`: that resolves before *every*
  # command and would break `logs`, `ps` and `config` too. The check happens
  # when the container runs, so only `up` is affected.
  use-stremio-start-instead:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    restart: "no"
    # Gate only prints a message and exits: no network, no capabilities, no new privileges.
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      STREMIOGUARD_MANAGED: "${STREMIOGUARD_MANAGED:-0}"
    command:
      - sh
      - -c
      - |
        [ "$${STREMIOGUARD_MANAGED}" = "1" ] && exit 0
        echo "'docker compose up' skips the public-IP leak check and the watchdog,"
        echo "and does not render the override that publishes ports or configures Comet."
        echo "Run './stremio start' instead, or set STREMIOGUARD_MANAGED=1 to override."
        exit 1

  gluetun:
    depends_on:
      use-stremio-start-instead:
        condition: service_completed_successfully
    # Pinned by digest like every other image here; Dependabot proposes bumps.
    # This is the container the kill switch lives in, and the watchdog depends
    # on details of it (its healthcheck, `wget`, its log wording, the control
    # server route, and `/iptables/post-rules.txt`), so a new release is
    # something to review, not something a start should pick up on its own.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: unless-stopped
    # Keeps Docker default caps + NET_ADMIN (dropping defaults broke OpenVPN target.ovpn chown to PUID 1000, /tmp/gluetun/ip clearing on VPN restart, container restart, and ICMP health checks); writable root stays because Compose configs with content: fail on read_only services and gluetun writes /etc/openvpn/target.ovpn and /tmp/gluetun/.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    configs:
      - source: gluetun-post-rules-v1
        target: /iptables/post-rules.txt
    # Only gluetun's settings from .env, written by ./stremio on every start.
    # StremioGuard's own keys (all its secrets live under COMET_) never reach
    # the VPN container's environment.
    env_file:
      - path: ./.stremio/gluetun.env
        required: false
    # Literal values below are pins that override .stremio/gluetun.env: .env
    # cannot change them, and `./stremio start` warns when it tries.
    # Remaining entries are interpolated from .env for Compose/gluetun.
    environment:
      DNS_KEEP_NAMESERVER: "off"
      FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT: "on"
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:18080"
      HTTPPROXY: "off"
      SHADOWSOCKS: "off"
      PPROF_ENABLED: "no"
      HEALTH_SERVER_ADDRESS: "127.0.0.1:9999"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: "/gluetun/auth/config.toml"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: "{}"
      FIREWALL_INPUT_PORTS: ""
      FIREWALL_VPN_INPUT_PORTS: ""
      FIREWALL_OUTBOUND_SUBNETS: ""
      VPN_PORT_FORWARDING: "off"
      VPN_INTERFACE: "tun0"
      HTTP_CONTROL_SERVER_LOG: "${HTTP_CONTROL_SERVER_LOG:-off}"
      UPDATER_PERIOD: "${UPDATER_PERIOD:-480h}"
      SERVER_COUNTRIES: "${SERVER_COUNTRIES:-}"
      SERVER_REGIONS: "${SERVER_REGIONS:-}"
      SERVER_CITIES: "${SERVER_CITIES:-}"
      SERVER_HOSTNAMES: "${SERVER_HOSTNAMES:-}"
      SERVER_CATEGORIES: "${SERVER_CATEGORIES:-}"
      OPENVPN_ENDPOINT_IP: "${OPENVPN_ENDPOINT_IP:-}"
      WIREGUARD_ENDPOINT_IP: "${WIREGUARD_ENDPOINT_IP:-}"
    volumes:
      - ./gluetun-data:/gluetun

  stremio:
    build:
      context: .
      dockerfile: docker/stremio/Dockerfile
      args:
        STREMIO_APPLY_PATCHES: ${STREMIO_APPLY_PATCHES:-1}
    image: stremioguard-stremio:local
    restart: "no"
    # CHOWN/SETGID/SETUID/DAC_OVERRIDE: image nginx writes/chowns under 0750 nginx:nginx /var/lib/nginx/tmp and drops to nginx workers; writable root stays because the entrypoint edits server.js and copies localStorage.json into build/.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    shm_size: "2gb"
    environment:
      - NO_CORS=1
      - AUTO_SERVER_URL=1
      - CASTING_DISABLED=${CASTING_DISABLED:-}
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
      - STREMIO_SKIP_HW_PROBE=${STREMIO_SKIP_HW_PROBE:-1}
      - EXTERNAL_BASE_URL=${EXTERNAL_BASE_URL:-}
      - INTERNAL_MEDIA_BASE_URL=${INTERNAL_MEDIA_BASE_URL:-http://127.0.0.1:11470}
    volumes:
      - ./stremio-data:/root/.stremio-server
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy

  comet-gateway:
    # Sees the gateway tokens: pinned by digest; Dependabot proposes bumps.
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    # restart: "no" like stremio: nothing that fronts debrid traffic should be
    # revived by Docker before the watchdog has re-verified the VPN path. The
    # watchdog auto-starts the Comet trio once gluetun is healthy.
    restart: "no"
    # CHOWN/SETGID/SETUID: nginx master chowns /var/cache/nginx temp dirs to uid 101 and drops to nginx workers; tmpfs /tmp holds nginx.pid and /var/cache/nginx holds temp buffers on the read-only root.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    # The generated config lives in a mounted directory (see GATEWAY_CONFIG_DIR
    # in src/stremioguard/comet_gateway.py) so token changes reach nginx.
    command: ["nginx", "-c", "/etc/nginx/stremioguard/nginx.conf", "-g", "daemon off;"]
    # Proves nginx master and a worker accept and answer on loopback (and the
    # public listener is bound, since nginx refuses to start otherwise); does
    # not contact Comet.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:8099/__sg_alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  comet-postgres:
    # Pinned by digest. Majors stay manual: they need a data-directory upgrade.
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: "no"
    # CHOWN/SETGID/SETUID for initdb and dropping to postgres, DAC_READ_SEARCH so root find can traverse existing 0700 uid-70 data dirs across restarts; writable root stays because Compose configs with content: (comet-postgres-hba-v1) fail on read_only services.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # The data directory lives here, in the base file, so that no way of
    # starting this service can miss it. It used to be supplied only by the
    # generated override, which meant a plain `docker compose up` gave Postgres
    # an empty anonymous volume and it tried to initialize a new database on
    # top of a working one. Guarding against that with a `${VAR:?}` tripwire
    # was worse than the disease: Compose interpolates before *every* command,
    # so `logs` and `ps` broke too. A fixed relative path costs nothing and
    # removes the failure mode entirely.
    volumes:
      - ./.stremio/comet/postgres-data:/var/lib/postgresql/
    configs:
      - source: comet-postgres-hba-v1
        target: /etc/postgresql/pg_hba.conf
    # Credentials come from a generated file so no password is hardcoded here.
    # `required: false` keeps every Compose command working before `./stremio
    # init` has generated it; Postgres then refuses to initialize a *new*
    # cluster without a password, which is the correct failure and its own
    # clear message.
    env_file:
      - path: ./.stremio/comet/postgres.env
        required: false
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
      - "-c"
      - "listen_addresses=127.0.0.1"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Comet's gateway to every debrid service. Self-hosted so the debrid key in
  # each request leaves this host only towards the debrid service, through the
  # tunnel; Comet's default is a public instance run by a third party. It
  # listens on loopback inside gluetun's namespace and is never published.
  stremthru:
    # Pinned by digest; Dependabot proposes bumps.
    image: muniftanjim/stremthru:0.105.4@sha256:947cfcb2601c67f2f21eb11bd1ea1e555889cec9e0b347cefd0c63754b9c641a
    restart: "no"
    # Needs no capabilities; tmpfs /tmp gives a writable scratch dir on the read-only root while /app/data is bind-mounted.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    # Generated by ./stremio (STREMTHRU_AUTH). Without it StremThru invents an
    # admin password and prints it to its log.
    env_file:
      - path: ./.stremio/stremthru/stremthru.env
        required: false
    environment:
      # Must match STREMTHRU_PORT in src/stremioguard/config.py, whose
      # NAMESPACE_PORTS is the registry of ports in this shared namespace.
      # Not 8080: the Stremio image's own nginx listens there.
      STREMTHRU_LISTEN_ADDR: 127.0.0.1:8091
      # Upstream peers with the public instance by default; "-" turns it off.
      STREMTHRU_PEER_URI: "-"
      # Comet uses only the store API. `torz` must stay on: it registers the
      # magnet-check, magnet and link-generation routes Comet plays through
      # (it also parses seen torrent names and crawls the caller's own debrid
      # library, both locally). Everything else (dataset syncs, Usenet,
      # StremThru's own addons) stays off.
      STREMTHRU_FEATURE: "-meta,-newz,-sync,-vault,-dmm_hashlist,-imdb_title,-stremio_list,-stremio_newz,-stremio_sidekick,-stremio_store,-stremio_torz,-stremio_wrap,-probe_media_info"
      STREMTHRU_LOG_FORMAT: text
    volumes:
      - ./.stremio/stremthru/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8091/v0/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  comet:
    image: ${COMET_IMAGE:-g0ldyy/comet}
    restart: "no"
    # Needs no capabilities; tmpfs /tmp holds mediaflow's TTL-bounded HLS/DASH caches on the read-only root while /app/data is bind-mounted.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_TYPE: postgresql
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      comet-postgres:
        condition: service_healthy
      stremthru:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

