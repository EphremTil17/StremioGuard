services:
  # A gate, not a service. `docker compose up` on its own produces a stack with
  # no published ports, an unconfigured Comet, no public-IP leak check and no
  # watchdog -- quietly broken rather than dangerous, which is worse to debug.
  # Everything hangs off gluetun, so gating gluetun gates the whole stack.
  #
  # The name carries the instruction on purpose. Compose prints the container's
  # own output only for an attached `up`; for `up -d` the single line the
  # operator sees is `service "..." didn't complete successfully`, so the
  # service name is the only text guaranteed to reach them either way.
  #
  # Nothing here is interpolated with `${VAR:?}`: that resolves before *every*
  # command and would break `logs`, `ps` and `config` too. The check happens
  # when the container runs, so only `up` is affected.
  use-stremio-start-instead:
    image: busybox:stable
    restart: "no"
    environment:
      STREMIOGUARD_MANAGED: "${STREMIOGUARD_MANAGED:-0}"
    command:
      - sh
      - -c
      - |
        [ "$${STREMIOGUARD_MANAGED}" = "1" ] && exit 0
        echo "'docker compose up' skips the public-IP leak check and the watchdog,"
        echo "and does not render the override that publishes ports or configures Comet."
        echo "Run './stremio start' instead, or set STREMIOGUARD_MANAGED=1 to override."
        exit 1

  gluetun:
    depends_on:
      use-stremio-start-instead:
        condition: service_completed_successfully
    # Release channel, not master builds; the guard best-effort pulls this
    # tag on every start/restart so the newest v3 release is always used.
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:18080
      HTTP_CONTROL_SERVER_LOG: "${HTTP_CONTROL_SERVER_LOG:-off}"
      UPDATER_PERIOD: "${UPDATER_PERIOD:-480h}"
      SERVER_COUNTRIES: "${SERVER_COUNTRIES:-}"
      SERVER_REGIONS: "${SERVER_REGIONS:-}"
      SERVER_CITIES: "${SERVER_CITIES:-}"
      SERVER_HOSTNAMES: "${SERVER_HOSTNAMES:-}"
      SERVER_CATEGORIES: "${SERVER_CATEGORIES:-}"
      OPENVPN_ENDPOINT_IP: "${OPENVPN_ENDPOINT_IP:-}"
      WIREGUARD_ENDPOINT_IP: "${WIREGUARD_ENDPOINT_IP:-}"
    volumes:
      - ./gluetun-data:/gluetun

  stremio:
    build:
      context: .
      dockerfile: docker/stremio/Dockerfile
      args:
        STREMIO_APPLY_PATCHES: ${STREMIO_APPLY_PATCHES:-1}
    image: stremioguard-stremio:local
    restart: "no"
    shm_size: "2gb"
    environment:
      - NO_CORS=1
      - AUTO_SERVER_URL=1
      - CASTING_DISABLED=${CASTING_DISABLED:-}
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
      - STREMIO_SKIP_HW_PROBE=${STREMIO_SKIP_HW_PROBE:-1}
      - EXTERNAL_BASE_URL=${EXTERNAL_BASE_URL:-}
      - INTERNAL_MEDIA_BASE_URL=${INTERNAL_MEDIA_BASE_URL:-http://127.0.0.1:11470}
    volumes:
      - ./stremio-data:/root/.stremio-server
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy

  comet-gateway:
    image: nginx:alpine
    # restart: "no" like stremio: nothing that fronts debrid traffic should be
    # revived by Docker before the watchdog has re-verified the VPN path. The
    # watchdog auto-starts the Comet trio once gluetun is healthy.
    restart: "no"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  comet-postgres:
    image: postgres:18-alpine
    restart: "no"
    # The data directory lives here, in the base file, so that no way of
    # starting this service can miss it. It used to be supplied only by the
    # generated override, which meant a plain `docker compose up` gave Postgres
    # an empty anonymous volume and it tried to initialize a new database on
    # top of a working one. Guarding against that with a `${VAR:?}` tripwire
    # was worse than the disease: Compose interpolates before *every* command,
    # so `logs` and `ps` broke too. A fixed relative path costs nothing and
    # removes the failure mode entirely.
    volumes:
      - ./.stremio/comet/postgres-data:/var/lib/postgresql/
    # Credentials come from a generated file so no password is hardcoded here.
    # `required: false` keeps every Compose command working before `./stremio
    # init` has generated it; Postgres then refuses to initialize a *new*
    # cluster without a password, which is the correct failure and its own
    # clear message.
    env_file:
      - path: ./.stremio/comet/postgres.env
        required: false
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=100"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet"]
      interval: 5s
      timeout: 5s
      retries: 5

  comet:
    image: ${COMET_IMAGE:-g0ldyy/comet}
    restart: "no"
    environment:
      DATABASE_TYPE: postgresql
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      comet-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

